plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
group = 'de.egox'
version = project.mod_version
base { archivesName = 'EgoX-SeedCracker' }
repositories { mavenCentral(); maven { url 'https://maven.terraformersmc.com/releases/' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly 'com.terraformersmc:modmenu:21.0.0'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
apply from: '../../shared/egox.gradle'
