plugins {
    id 'fabric-loom' version '1.14.10'
}
group = 'de.egox'
version = project.mod_version
base { archivesName = 'EgoX-SeedCracker' }
repositories { mavenCentral(); maven { url 'https://maven.terraformersmc.com/releases/' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly 'com.terraformersmc:modmenu:17.0.1'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
apply from: '../../shared/egox.gradle'
