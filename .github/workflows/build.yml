name: Build EgoX
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - minecraft: '1.21.11'
            java: '21'
          - minecraft: '26.3'
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Test and build
        run: bash versions/${{ matrix.minecraft }}/gradlew -p versions/${{ matrix.minecraft }} build -PegoxFullRecovery
      - uses: actions/upload-artifact@v4
        with:
          name: EgoX-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/EgoX-SeedCracker-*.jar
